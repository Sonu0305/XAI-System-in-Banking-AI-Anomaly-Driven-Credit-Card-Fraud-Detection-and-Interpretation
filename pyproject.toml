[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-fraud-detection"
version = "1.0.0"
description = "XAI System in Banking: AI Anomaly-Driven Credit Card Fraud Detection and Interpretation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "imbalanced-learn>=0.12.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "shap>=0.44.0",
    "lime>=0.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
    "kaggle>=1.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

